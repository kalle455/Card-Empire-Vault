    }

    function toast(message, error=false) {
      const el = document.createElement('div');
      el.className = 'toast';
      if (error) el.style.borderColor = '#9f3c48';
      el.textContent = message;
      $('toast-stack').appendChild(el);
      setTimeout(() => el.remove(), 4200);
    }

    function busy(button, value) {
      if (!button) return;
      button.disabled = value;
      button.style.cursor = value ? 'wait' : '';
    }

    async function createRow(row, button) {
      if (!state.sdkReady) { toast('The marketplace data connection is not ready yet.', true); return false; }
      if (state.all.length >= 999) { toast('The 999-record limit has been reached. Delete records before adding more.', true); return false; }
      busy(button,true);
      const result = await window.dataSdk.create(blankRecord(row));
      busy(button,false);
      if (!result.isOk) { toast('The record could not be saved. Please try again.', true); return false; }
      return true;
    }

    async function updateRow(row, button) {
      if (!state.sdkReady) { toast('The marketplace data connection is not ready yet.', true); return false; }
      busy(button,true);
      const result = await window.dataSdk.update(row);
      busy(button,false);
      if (!result.isOk) { toast('The change could not be saved.', true); return false; }
      return true;
    }

    async function deleteRow(row, button) {
      busy(button,true);
      const result = await window.dataSdk.delete(row);
      busy(button,false);
      if (!result.isOk) { toast('The record could not be deleted.', true); return false; }
      return true;
    }

    function roleClass(role) {
      return role === 'ADMIN' ? 'role-admin' :
        role === 'V.I.P' ? 'role-vip' :
        role === 'POTM' ? 'role-potm' :
        role === 'Regular Customer' ? 'role-regular' : 'role-customer';
    }

    function normalRole(role) {
      return ROLES.includes(role) ? role : 'Customer';
    }

    function statusClass(status) {
      const value = String(status || 'Open').toLowerCase();
      if (value === 'accepted') return 'status-accepted';
      if (value === 'declined') return 'status-declined';
      if (value === 'completed') return 'status-completed';
      if (value === 'available') return 'status-available';
      if (value === 'unavailable') return 'status-unavailable';
      if (value === 'upcoming') return 'status-upcoming';
      return 'status-open';
    }

    function requireProfile() {
      if (state.currentUser) return true;
      openModal('profile-create-modal');
      toast('Create or resume your username profile to continue.');
      return false;
    }

    function openModal(id) {
      $(id).hidden = false;
      document.body.style.overflow = 'hidden';
      setTimeout(() => $(id).querySelector('input,textarea,select,button')?.focus(),20);
    }

    function closeModal(target) {
      const modal = target.closest ? target.closest('.modal') : target;
      if (modal) modal.hidden = true;
      if (![...document.querySelectorAll('.modal')].some(x=>!x.hidden)) document.body.style.overflow = '';
    }

    function routeTo(route) {
      if (route === 'admin' && !isAdmin()) { toast('This workspace requires an ADMIN profile.', true); return; }
      const target = $('view-' + route) ? route : 'home';
      document.querySelectorAll('.view').forEach(view => view.hidden = view.id !== 'view-' + target);
      document.querySelectorAll('[data-route]').forEach(button => button.classList.toggle('active',button.dataset.route === target));
      $('mobile-nav').classList.add('hidden');
      $('mobile-menu-button').setAttribute('aria-expanded','false');
      window.scrollTo({top:0,behavior:'smooth'});
      if (target === 'market') renderMarket();
      if (target === 'offers') renderCustomerActivity();
      if (target === 'messages') renderThreads();
      if (target === 'events') renderEvents();
      if (target === 'reviews') renderReviews();
      if (target === 'admin') renderAdmin();
    }

    function makeThread(username, cardName, sourceId) {
      return `thread-${sourceId || Date.now()}-${username.toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${cardName.toLowerCase().replace(/[^a-z0-9]+/g,'-')}`;
    }

    function placeholderArtwork(name) {
      const node = document.createElement('div');
      node.className = 'placeholder-art';
      node.innerHTML = `<div><i data-lucide="scan-search" class="mx-auto mb-3 h-10 w-10"></i><strong class="display-font block">${escapeHtml(name)}</strong><span class="mt-2 block text-xs uppercase tracking-widest text-white/35">Artwork unavailable</span></div>`;
      return node;
    }

    async function resolveCardImage(card, slot) {
      if (!slot?.isConnected) return;
      const key = card.card_name.trim().toLowerCase();
      if (state.imageCache.has(key)) return setCardImage(slot,state.imageCache.get(key),card.card_name);
      try {
        const response = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?name=${encodeURIComponent(card.card_name)}`);
        if (!response.ok) throw new Error('Image search failed');
        const body = await response.json();
        const url = body?.data?.[0]?.card_images?.[0]?.image_url_cropped || body?.data?.[0]?.card_images?.[0]?.image_url;
        if (!url) throw new Error('No image');
        state.imageCache.set(key,url);
        if (slot.isConnected) setCardImage(slot,url,card.card_name);
      } catch {
        state.imageCache.set(key,null);
        if (slot.isConnected) setCardImage(slot,null,card.card_name);
      }
    }

    function setCardImage(slot,url,name) {
      if (!url) {
        slot.replaceChildren(placeholderArtwork(name));
        lucide.createIcons();
        return;
      }
      const img = document.createElement('img');
      img.src = url;
      img.alt = `${name} card artwork`;
      img.loading = 'lazy';
      img.addEventListener('error',()=>{ slot.replaceChildren(placeholderArtwork(name)); lucide.createIcons(); },{once:true});
      slot.replaceChildren(img);
    }

    function makeCard(card) {
      const frag = $('card-template').content.cloneNode(true);
      const article = frag.querySelector('article');
      article.dataset.recordId = card.__backendId;
      frag.querySelector('.card-name').textContent = card.card_name;
      frag.querySelector('.card-price').textContent = formatMoney(card.card_price);
      const status = frag.querySelector('.card-status');
      status.textContent = card.card_available ? 'Available' : 'Unavailable';
      status.className = `card-status status ${card.card_available?'status-available':'status-unavailable'}`;
      frag.querySelector('.card-open').addEventListener('click',()=>openCard(card.__backendId));
      resolveCardImage(card,frag.querySelector('.card-image-slot'));
      return article;
    }

    function syncCardGrid(container,cards) {
      const existing = new Map([...container.children].map(el=>[el.dataset.recordId,el]));
      cards.forEach(card=>{
        const next = makeCard(card);
        const current = existing.get(card.__backendId);
        if (current) { current.replaceWith(next); existing.delete(card.__backendId); }
        else container.appendChild(next);
      });
      existing.forEach(el=>el.remove());
      lucide.createIcons();
    }

    function openCard(id) {
      const card = state.cards.find(x=>x.__backendId===id);
      if (!card) return;
      state.selectedCard = card;
      $('detail-name').textContent = card.card_name;
      $('detail-price').textContent = formatMoney(card.card_price);
      $('detail-availability').textContent = card.card_available ? 'Available' : 'Unavailable';
      $('detail-availability').className = `status ${card.card_available?'status-available':'status-unavailable'}`;
      $('request-buy-button').disabled = !card.card_available;
      $('open-offer-button').disabled = !card.card_available;
      const art = $('detail-art');
      art.replaceChildren(placeholderArtwork(card.card_name));
      resolveCardImage(card,art);
      openModal('card-modal');
      lucide.createIcons();
    }

    function renderHome() {
      const cards = state.cards.filter(x=>x.card_available).slice(0,4);
      syncCardGrid($('home-card-grid'),cards);
      $('home-card-empty').classList.toggle('hidden',cards.length>0);
    }

    function renderMarket() {
      const query = $('market-search').value.trim().toLowerCase();
      const filter = $('availability-filter').value;
      const cards = state.cards
        .filter(card => (!query || card.card_name.toLowerCase().includes(query)) &&
          (filter==='all' || (filter==='available' ? card.card_available : !card.card_available)))
        .sort((a,b)=>a.card_name.localeCompare(b.card_name,'en'));
      syncCardGrid($('market-grid'),cards);
      $('market-count').textContent = `${cards.length} card${cards.length===1?'':'s'}`;
      $('market-empty').classList.toggle('hidden',cards.length>0);
    }

    function emptyMarkup(text) {
      return `<div class="glass rounded-xl p-6 text-center text-sm text-white/45">${escapeHtml(text)}</div>`;
    }

    function renderCustomerActivity() {
      if (!state.currentUser) {
        $('customer-purchases').innerHTML = emptyMarkup('Create a profile to view purchase requests.');
        $('customer-offers').innerHTML = emptyMarkup('Create a profile to view offers.');
        return;
      }
      const username = state.currentUser.username.toLowerCase();
      const purchases = state.purchases.filter(x=>x.username.toLowerCase()===username).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
      const offers = state.offers.filter(x=>x.username.toLowerCase()===username).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
      $('customer-purchases').innerHTML = purchases.length ? purchases.map(row=>`
        <article class="panel rounded-xl p-5">
          <div class="flex items-start justify-between gap-4">
            <div><h3 class="font-bold">${escapeHtml(row.card_name)}</h3><p class="mt-2 text-sm text-white/45">${escapeHtml(formatDate(row.created_at))} · ${escapeHtml(formatMoney(row.card_price))}</p></div>
            <span class="status ${statusClass(row.status)}">${escapeHtml(row.status||'Open')}</span>
          </div>
          <button type="button" data-open-thread="${escapeHtml(row.chat_thread)}" class="secondary mt-4 rounded-lg px-4 py-2 text-sm font-bold">Open conversation</button>
        </article>`).join('') : emptyMarkup('No purchase requests yet.');
      $('customer-offers').innerHTML = offers.length ? offers.map(row=>`
        <article class="panel rounded-xl p-5">
          <div class="flex items-start justify-between gap-4">
            <div><h3 class="font-bold">${escapeHtml(row.card_name)}</h3><p class="mt-2 text-sm text-white/45">${escapeHtml(formatMoney(row.offer_amount))} · ${escapeHtml(formatDate(row.created_at))}</p><p class="mt-3 text-sm text-white/60">${escapeHtml(row.offer_message)}</p></div>
            <span class="status ${statusClass(row.status)}">${escapeHtml(row.status||'Open')}</span>
          </div>
          <button type="button" data-open-thread="${escapeHtml(row.chat_thread)}" class="secondary mt-4 rounded-lg px-4 py-2 text-sm font-bold">Open conversation</button>
        </article>`).join('') : emptyMarkup('No offers yet.');
      document.querySelectorAll('[data-open-thread]').forEach(button=>button.onclick=()=>{
        state.selectedThread=button.dataset.openThread;
        routeTo('messages');
      });
    }

    function accessibleThreads() {
      const allThreads = new Map();
      [...state.offers,...state.purchases].forEach(row=>{
        if (!row.chat_thread) return;
        if (isAdmin() || (state.currentUser && row.username.toLowerCase()===state.currentUser.username.toLowerCase())) {
          allThreads.set(row.chat_thread,{thread:row.chat_thread,username:row.username,card:row.card_name,status:row.status,created_at:row.created_at});
        }
      });
      state.messages.forEach(row=>{
        if (!row.chat_thread) return;
        const involved = isAdmin() || (state.currentUser && [row.chat_from,row.chat_to].some(v=>v.toLowerCase()===state.currentUser.username.toLowerCase()));
        if (involved && !allThreads.has(row.chat_thread)) allThreads.set(row.chat_thread,{thread:row.chat_thread,username:row.chat_from==='ADMIN'?row.chat_to:row.chat_from,card:row.chat_card,status:row.status,created_at:row.created_at});
      });
      return [...allThreads.values()].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    }

    function renderThreads() {
      const threads = accessibleThreads();
      if (!threads.some(x=>x.thread===state.selectedThread)) state.selectedThread = threads[0]?.thread || '';
      $('thread-list').innerHTML = threads.length ? threads.map(thread=>`
        <button type="button" data-thread="${escapeHtml(thread.thread)}" class="w-full rounded-xl border border-white/8 bg-white/[.025] p-4 text-left ${thread.thread===state.selectedThread?'thread-active':''}">
          <strong class="block">${escapeHtml(thread.card)}</strong>
          <span class="mt-1 block text-sm text-white/45">${escapeHtml(thread.username)}</span>
        </button>`).join('') : emptyMarkup('No conversations yet.');
      document.querySelectorAll('[data-thread]').forEach(button=>button.onclick=()=>{state.selectedThread=button.dataset.thread;renderThreads();});
      renderActiveChat();
    }

    function renderActiveChat() {
      const thread = accessibleThreads().find(x=>x.thread===state.selectedThread);
      $('chat-empty').classList.toggle('hidden',!!thread);
      $('chat-active').classList.toggle('hidden',!thread);
      $('chat-active').classList.toggle('flex',!!thread);
      if (!thread) return;
      $('chat-heading').textContent = thread.card;
      $('chat-meta').textContent = isAdmin() ? `Customer: ${thread.username}` : `${BRAND} seller conversation`;
      const rows = state.messages.filter(x=>x.chat_thread===thread.thread).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
      $('message-list').innerHTML = rows.length ? rows.map(message=>{
        const mine = state.currentUser && message.chat_from.toLowerCase()===state.currentUser.username.toLowerCase();
        const adminMine = isAdmin() && message.chat_from==='ADMIN';
        return `<article class="${mine||adminMine?'message-mine':'message-other'} max-w-[85%] rounded-xl border p-3">
          <div class="flex items-center justify-between gap-4 text-xs text-white/40"><strong class="text-white/65">${escapeHtml(message.chat_from)}</strong><span>${escapeHtml(formatDate(message.created_at))}</span></div>
          <p class="mt-2 whitespace-pre-wrap text-sm leading-relaxed text-white/80">${escapeHtml(message.chat_message)}</p>
        </article>`;
      }).join('') : emptyMarkup('The conversation is ready. Send the first message.');
      $('message-list').scrollTop = $('message-list').scrollHeight;
    }

    function reviewMarkup(row) {
      const stars = Math.max(1,Math.min(5,Number(row.feedback_stars)||1));
      return `<article class="panel rounded-2xl p-6">
        <div class="flex items-center justify-between gap-4"><div class="tracking-widest text-amber-200" aria-label="${stars} out of 5 stars">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div><span class="text-xs text-white/35">${escapeHtml(formatDate(row.created_at))}</span></div>
        <p class="mt-4 leading-relaxed text-white/70">“${escapeHtml(row.feedback_message)}”</p>
        <strong class="mt-5 block text-sm text-amber-100">${escapeHtml(row.username)}</strong>
      </article>`;
    }

    function renderReviews() {
      const rows = [...state.reviews].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
      $('review-list').innerHTML = rows.length ? rows.map(reviewMarkup).join('') : emptyMarkup('No feedback has been published yet.');
    }

    function eventMarkup(event,past) {
      return `<article class="panel rounded-2xl p-6">
        <div class="flex items-start justify-between gap-4"><h3 class="text-xl font-bold">${escapeHtml(event.event_name)}</h3><span class="status ${past?'status-completed':'status-upcoming'}">${past?'Past':'Upcoming'}</span></div>
        <div class="mt-5 grid gap-3 text-sm text-white/55 sm:grid-cols-2">
          <span><i data-lucide="calendar" class="mr-2 inline h-4 w-4 text-amber-200"></i>${escapeHtml(formatDate(event.event_date))}</span>
          <span><i data-lucide="map-pin" class="mr-2 inline h-4 w-4 text-cyan-300"></i>${escapeHtml(event.event_location||'Location not set')}</span>
          <span><i data-lucide="users" class="mr-2 inline h-4 w-4 text-amber-200"></i>${escapeHtml(event.event_participants||'Participants not set')}</span>
          <span><i data-lucide="trophy" class="mr-2 inline h-4 w-4 text-cyan-300"></i>${escapeHtml(event.event_prize||'Prize not set')}</span>
        </div>
        ${event.event_winner?`<p class="mt-5 border-t border-white/8 pt-4 text-sm"><span class="text-white/40">Winner:</span> <strong class="text-amber-100">${escapeHtml(event.event_winner)}</strong></p>`:''}
      </article>`;
    }

    function renderEvents() {
      const now = Date.now();
      const upcoming = state.events.filter(x=>new Date(x.event_date).getTime()>=now).sort((a,b)=>new Date(a.event_date)-new Date(b.event_date));
      const past = state.events.filter(x=>new Date(x.event_date).getTime()<now).sort((a,b)=>new Date(b.event_date)-new Date(a.event_date));
      $('upcoming-events').innerHTML = upcoming.length ? upcoming.map(x=>eventMarkup(x,false)).join('') : emptyMarkup('No upcoming events have been published.');
      $('past-events').innerHTML = past.length ? past.map(x=>eventMarkup(x,true)).join('') : emptyMarkup('No past events are available.');
      lucide.createIcons();
    }

    function updateCurrentUser() {
      const saved = localStorage.getItem('kalenski-profile');
      const match = saved ? state.users.find(x=>x.username.toLowerCase()===saved.toLowerCase()) : null;
      state.currentUser = match || null;
      $('create-profile-button').classList.toggle('hidden',!!match);
      $('profile-button').classList.toggle('hidden',!match);
      $('profile-button').classList.toggle('md:flex',!!match);
      $('admin-nav').classList.toggle('hidden',!isAdmin());
      $('mobile-admin-nav').classList.toggle('hidden',!isAdmin());
      if (match) {
        const role = normalRole(match.role);
        $('header-username').textContent = match.username;
        $('header-role').textContent = role;
        $('header-role').className = `status ${roleClass(role)}`;
        $('profile-name').textContent = match.username;
        $('profile-role').innerHTML = `<span class="status ${roleClass(role)}">${escapeHtml(role)}</span>`;
      }
      renderCustomerActivity();
      renderThreads();
    }

    function renderAdmin() {
      if (!isAdmin()) return;
      renderAdminCards();
      renderAdminUsers();
      renderAdminOffers();
      renderAdminPurchases();
      renderAdminEvents();
    }

    function renderAdminCards() {
      $('admin-card-list').innerHTML = state.cards.length ? `<table><thead><tr><th>Card</th><th>Price</th><th>Availability</th><th>Actions</th></tr></thead><tbody>${state.cards.map(card=>`
        <tr>
          <td><strong>${escapeHtml(card.card_name)}</strong></td>
          <td>${escapeHtml(formatMoney(card.card_price))}</td>
          <td><span class="status ${card.card_available?'status-available':'status-unavailable'}">${card.card_available?'Available':'Unavailable'}</span></td>
          <td><div class="flex gap-2"><button type="button" data-edit-card="${escapeHtml(card.__backendId)}" class="secondary rounded px-3 py-1.5 text-xs">Edit</button><button type="button" data-delete-card="${escapeHtml(card.__backendId)}" class="danger rounded px-3 py-1.5 text-xs">Delete</button></div></td>
        </tr>`).join('')}</tbody></table>` : emptyMarkup('No cards have been created.');
      document.querySelectorAll('[data-edit-card]').forEach(button=>button.onclick=()=>startCardEdit(button.dataset.editCard));
      document.querySelectorAll('[data-delete-card]').forEach(button=>button.onclick=()=>twoStepDelete('card',button.dataset.deleteCard,button));
    }

    function startCardEdit(id) {
      const card=state.cards.find(x=>x.__backendId===id); if(!card)return;
      $('card-edit-id').value=id;
      $('card-name').value=card.card_name;
      $('card-price').value=card.card_price;
      $('card-available').value=String(card.card_available);
      $('card-cancel').classList.remove('hidden');
      $('card-name').focus();
    }

    function renderAdminUsers() {
      $('admin-user-list').innerHTML = state.users.length ? state.users.map(user=>`
        <article class="panel flex flex-col gap-4 rounded-xl p-5 md:flex-row md:items-center md:justify-between">
          <div><strong>${escapeHtml(user.username)}</strong><p class="mt-1 text-sm text-white/40">${escapeHtml(formatDate(user.created_at))}</p></div>
          <form data-role-form="${escapeHtml(user.__backendId)}" class="flex flex-col gap-2 sm:flex-row">
            <label for="role-${escapeHtml(user.__backendId)}" class="sr-only">Role for ${escapeHtml(user.username)}</label>
            <select id="role-${escapeHtml(user.__backendId)}" class="field min-w-52">

            <button type="submit" class="primary rounded-lg px-4 py-2 font-bold">Save role</button>

        if(user && await updateRow({...user,role},form.querySelector('button'))) toast(`Role updated to ${role}.`);

    function renderAdminOffers() {
      $('admin-offer-list').innerHTML = state.offers.length ? [...state.offers].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(offer=>`
        <article class="panel rounded-xl p-5">
          <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
            <div><span class="status ${statusClass(offer.status)}">${escapeHtml(offer.status||'Open')}</span><h3 class="mt-3 font-bold">${escapeHtml(offer.card_name)}</h3><p class="mt-1 text-sm text-white/45">${escapeHtml(offer.username)} · ${escapeHtml(formatMoney(offer.offer_amount))}</p><p class="mt-3 text-sm text-white/65">${escapeHtml(offer.offer_message)}</p></div>
            <div class="flex flex-wrap gap-2">
              <button type="button" data-offer-status="${escapeHtml(offer.__backendId)}|Accepted" class="primary rounded px-3 py-2 text-sm font-bold">Accept</button>
              <button type="button" data-offer-status="${escapeHtml(offer.__backendId)}|Declined" class="danger rounded px-3 py-2 text-sm">Decline</button>
              <button type="button" data-offer-reply="${escapeHtml(offer.__backendId)}" class="secondary rounded px-3 py-2 text-sm">Reply</button>
            </div>
          </div>
        </article>`).join('') : emptyMarkup('No offers have been submitted.');
      document.querySelectorAll('[data-offer-status]').forEach(button=>button.onclick=async()=>{
        const [id,status]=button.dataset.offerStatus.split('|');
        const offer=state.offers.find(x=>x.__backendId===id);
        if(offer && await updateRow({...offer,status},button)) toast(`Offer marked ${status}.`);
      });
      document.querySelectorAll('[data-offer-reply]').forEach(button=>button.onclick=()=>{
        state.replyOfferId=button.dataset.offerReply;
        $('reply-message').value='';
        openModal('reply-modal');
      });
    }

    function renderAdminPurchases() {
      $('admin-purchase-list').innerHTML = state.purchases.length ? [...state.purchases].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(row=>`
        <article class="panel rounded-xl p-5">
          <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div><span class="status ${statusClass(row.status)}">${escapeHtml(row.status||'Open')}</span><h3 class="mt-3 font-bold">${escapeHtml(row.card_name)}</h3><p class="mt-1 text-sm text-white/45">${escapeHtml(row.username)} · ${escapeHtml(formatMoney(row.card_price))} · ${escapeHtml(formatDate(row.created_at))}</p></div>
            <form data-purchase-status="${escapeHtml(row.__backendId)}" class="flex gap-2">
              <label for="purchase-${escapeHtml(row.__backendId)}" class="sr-only">Purchase status</label>
              <select id="purchase-${escapeHtml(row.__backendId)}" class="field">
                ${['Open','Accepted','Declined','Completed'].map(status=>`<option ${row.status===status?'selected':''}>${status}</option>`).join('')}
              </select>
              <button type="submit" class="primary rounded-lg px-4 py-2 font-bold">Save</button>
            </form>
          </div>
        </article>`).join('') : emptyMarkup('No purchase requests have been submitted.');
      document.querySelectorAll('[data-purchase-status]').forEach(form=>form.onsubmit=async event=>{
        event.preventDefault();
        const row=state.purchases.find(x=>x.__backendId===form.dataset.purchaseStatus);
        const status=form.querySelector('select').value;
        if(row && await updateRow({...row,status},form.querySelector('button'))) toast(`Purchase request marked ${status}.`);
      });
    }

    function renderAdminEvents() {
      $('admin-event-list').innerHTML = state.events.length ? [...state.events].sort((a,b)=>new Date(a.event_date)-new Date(b.event_date)).map(event=>`
        <article class="panel rounded-xl p-5">
          <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
            <div><h3 class="font-bold">${escapeHtml(event.event_name)}</h3><p class="mt-2 text-sm text-white/45">${escapeHtml(formatDate(event.event_date))} · ${escapeHtml(event.event_location)}</p></div>
            <div class="flex gap-2"><button type="button" data-edit-event="${escapeHtml(event.__backendId)}" class="secondary rounded px-3 py-2 text-sm">Edit</button><button type="button" data-delete-event="${escapeHtml(event.__backendId)}" class="danger rounded px-3 py-2 text-sm">Delete</button></div>
          </div>
        </article>`).join('') : emptyMarkup('No events have been created.');
      document.querySelectorAll('[data-edit-event]').forEach(button=>button.onclick=()=>startEventEdit(button.dataset.editEvent));
      document.querySelectorAll('[data-delete-event]').forEach(button=>button.onclick=()=>twoStepDelete('event',button.dataset.deleteEvent,button));
    }

    function startEventEdit(id) {
      const event=state.events.find(x=>x.__backendId===id);if(!event)return;
      $('event-edit-id').value=id;
      $('event-name').value=event.event_name;
      const date=new Date(event.event_date);
      date.setMinutes(date.getMinutes()-date.getTimezoneOffset());
      $('event-date').value=Number.isNaN(date.getTime())?'':date.toISOString().slice(0,16);
      $('event-location').value=event.event_location;
      $('event-participants').value=event.event_participants;
      $('event-winner').value=event.event_winner;
      $('event-prize').value=event.event_prize;
      $('event-cancel').classList.remove('hidden');
      $('event-name').focus();
    }

    async function twoStepDelete(type,id,button) {
      const key=`${type}-${id}`;
      if(!state.pendingDeletes.has(key)){
        state.pendingDeletes.add(key);
        button.textContent='Confirm delete';
        setTimeout(()=>{state.pendingDeletes.delete(key);if(button.isConnected)button.textContent='Delete';},3500);
        return;
      }
      state.pendingDeletes.delete(key);
      const row=state.all.find(x=>x.__backendId===id);
      if(row && await deleteRow(row,button)) toast('Record deleted.');
    }

    function resetCardForm() {
      $('card-form').reset(); $('card-edit-id').value=''; $('card-cancel').classList.add('hidden');
    }

    function resetEventForm() {
      $('event-form').reset(); $('event-edit-id').value=''; $('event-cancel').classList.add('hidden');
    }

    async function requestPurchase() {
      if (!requireProfile() || !state.selectedCard?.card_available) return;
      const card=state.selectedCard;
      const thread=makeThread(state.currentUser.username,card.card_name,`purchase-${Date.now()}`);
      const ok=await createRow({type:'purchase',username:state.currentUser.username,card_name:card.card_name,card_price:Number(card.card_price),status:'Open',chat_thread:thread},$('request-buy-button'));
      if(!ok)return;
      await createRow({type:'message',chat_from:state.currentUser.username,chat_to:'ADMIN',chat_message:`I would like to request this card at the listed price of ${formatMoney(card.card_price)}.`,chat_card:card.card_name,chat_thread:thread,status:'Open'},$('request-buy-button'));
      state.selectedThread=thread;
      closeModal($('card-modal'));
      routeTo('messages');
      toast('Purchase request created.');
    }

    function bindForms() {
      $('profile-form').addEventListener('submit',async event=>{
        event.preventDefault();
        const username=$('profile-username').value.trim();
        if(!username)return;
        let user=state.users.find(x=>x.username.trim().toLowerCase()===username.toLowerCase());
        if(!user){
          if(!await createRow({type:'user',username,role:'Customer',status:'Active'},$('profile-submit')))return;
          localStorage.setItem('kalenski-profile',username);
        } else {
          // Reuse the canonical Sheet username so the stored role is preserved.
          localStorage.setItem('kalenski-profile',user.username);
        }
        $('profile-create-status').textContent='Profile saved.';
        setTimeout(()=>{closeModal($('profile-create-modal'));updateCurrentUser();},300);
      });

      $('offer-form').addEventListener('submit',async event=>{
        event.preventDefault();
        if(!requireProfile() || !state.selectedCard)return;
        const card=state.selectedCard;
        const thread=makeThread(state.currentUser.username,card.card_name,`offer-${Date.now()}`);
        const amount=Number($('offer-amount').value);
        const message=$('offer-message').value.trim();
        const ok=await createRow({type:'offer',username:state.currentUser.username,card_name:card.card_name,offer_amount:amount,offer_message:message,status:'Open',chat_thread:thread},$('offer-submit'));
        if(!ok)return;
        await createRow({type:'message',chat_from:state.currentUser.username,chat_to:'ADMIN',chat_message:`Offer: ${formatMoney(amount)}\n${message}`,chat_card:card.card_name,chat_thread:thread,status:'Open'},$('offer-submit'));
        event.currentTarget.reset();
        state.selectedThread=thread;
        closeModal($('offer-modal'));
        routeTo('messages');
        toast('Offer sent.');
      });

      $('message-form').addEventListener('submit',async event=>{
        event.preventDefault();
        if(!state.currentUser || !state.selectedThread)return;
        const thread=accessibleThreads().find(x=>x.thread===state.selectedThread);
        if(!thread)return;
        const text=$('message-input').value.trim();
        if(!text)return;
        const from=isAdmin()?'ADMIN':state.currentUser.username;
        const to=isAdmin()?thread.username:'ADMIN';
        if(await createRow({type:'message',chat_from:from,chat_to:to,chat_message:text,chat_card:thread.card,chat_thread:thread.thread,status:'Open'},$('message-send'))) $('message-input').value='';
      });

      $('review-form').addEventListener('submit',async event=>{
        event.preventDefault();
        if(!requireProfile())return;
        const ok=await createRow({type:'review',username:state.currentUser.username,feedback_stars:Number($('review-stars').value),feedback_message:$('review-message').value.trim(),status:'Published'},$('review-submit'));
        if(ok){$('review-message').value='';$('review-status').textContent='Your feedback has been published.';toast('Feedback published.');}
      });

      $('card-form').addEventListener('submit',async event=>{
        event.preventDefault();
        const id=$('card-edit-id').value;
        const current=state.cards.find(x=>x.__backendId===id);
        const payload={type:'card',card_name:$('card-name').value.trim(),card_price:Number($('card-price').value),card_available:$('card-available').value==='true',status:'Active'};
        const ok=current?await updateRow({...current,...payload},$('card-save')):await createRow(payload,$('card-save'));
        if(ok){resetCardForm();toast(current?'Card updated.':'Card created. Artwork will load automatically.');}
      });

      $('event-form').addEventListener('submit',async event=>{
        event.preventDefault();
        const id=$('event-edit-id').value;
        const current=state.events.find(x=>x.__backendId===id);
        const payload={type:'event',event_name:$('event-name').value.trim(),event_date:new Date($('event-date').value).toISOString(),event_location:$('event-location').value.trim(),event_participants:$('event-participants').value.trim(),event_winner:$('event-winner').value.trim(),event_prize:$('event-prize').value.trim(),status:'Published'};
        const ok=current?await updateRow({...current,...payload},$('event-save')):await createRow(payload,$('event-save'));
        if(ok){resetEventForm();toast(current?'Event updated.':'Event created.');}
      });

      $('reply-form').addEventListener('submit',async event=>{
        event.preventDefault();
        const offer=state.offers.find(x=>x.__backendId===state.replyOfferId);
        if(!offer)return;
        const text=$('reply-message').value.trim();
        if(await createRow({type:'message',chat_from:'ADMIN',chat_to:offer.username,chat_message:text,chat_card:offer.card_name,chat_thread:offer.chat_thread,status:'Open'},$('reply-submit'))){
          event.currentTarget.reset();
          closeModal($('reply-modal'));
          state.selectedThread=offer.chat_thread;
          routeTo('messages');
          toast('Reply sent.');
        }
      });
    }

    function bindUI() {
      document.querySelectorAll('[data-route]').forEach(button=>button.addEventListener('click',()=>{
        const route=button.dataset.route;
        closeModal(button);
        routeTo(route);
      }));
      document.querySelectorAll('.modal-close').forEach(button=>button.onclick=()=>closeModal(button));
      document.querySelectorAll('.modal').forEach(modal=>modal.onclick=event=>{if(event.target===modal)closeModal(modal);});
      $('mobile-menu-button').onclick=()=>{const hidden=$('mobile-nav').classList.toggle('hidden');$('mobile-menu-button').setAttribute('aria-expanded',String(!hidden));};
      $('create-profile-button').onclick=()=>openModal('profile-create-modal');
      $('hero-profile-button').onclick=()=>state.currentUser?openModal('profile-modal'):openModal('profile-create-modal');
      $('profile-button').onclick=()=>openModal('profile-modal');
      $('forget-profile-button').onclick=()=>{localStorage.removeItem('kalenski-profile');closeModal($('profile-modal'));updateCurrentUser();toast('This device will no longer remember the profile.');};
      $('market-filter-form').onsubmit=event=>event.preventDefault();
      $('market-search').addEventListener('input',renderMarket);
      $('availability-filter').addEventListener('change',renderMarket);
      $('request-buy-button').onclick=requestPurchase;
      $('open-offer-button').onclick=()=>{
        if(!requireProfile())return;
        closeModal($('card-modal'));
        $('offer-card-name').textContent=state.selectedCard?.card_name||'';
        $('offer-amount').value=state.selectedCard?.card_price||0;
        openModal('offer-modal');
      };
      document.querySelectorAll('.admin-tab').forEach(button=>button.onclick=()=>{
        document.querySelectorAll('.admin-tab').forEach(x=>x.classList.toggle('active',x===button));
        document.querySelectorAll('.admin-pane').forEach(pane=>pane.classList.toggle('hidden',pane.id!==`admin-${button.dataset.adminTab}`));
      });
      $('card-cancel').onclick=resetCardForm;
      $('event-cancel').onclick=resetEventForm;
      document.addEventListener('keydown',event=>{if(event.key==='Escape'){const modal=[...document.querySelectorAll('.modal')].find(x=>!x.hidden);if(modal)closeModal(modal);}});
    }

    function processData(data) {
      state.all=data;
      state.users=byType('user');
      state.cards=byType('card');
      state.offers=byType('offer');
      state.purchases=byType('purchase');
      state.messages=byType('message');
      state.reviews=byType('review');
      state.events=byType('event');
      updateCurrentUser();
      renderHome();
      renderMarket();
      renderReviews();
      renderEvents();
      renderAdmin();
    }

    async function init() {
      bindUI();
      bindForms();
      lucide.createIcons();
      const result=await window.dataSdk.init({onDataChanged(data){processData(data);}});
      if(!result.isOk){toast('The Canva Sheet could not be connected.',true);return;}
      state.sdkReady=true;
    }
    init();
  })();
  </script>
 </body>
</html>
